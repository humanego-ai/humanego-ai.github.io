<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumanWAM · 手-物交互数据集总览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --bg2:#0b1122; --panel:rgba(20,27,48,.62); --panel2:rgba(28,37,64,.55);
  --line:rgba(120,140,190,.16); --line2:rgba(120,140,190,.28);
  --tx:#e8ecf6; --tx2:#a6b0c8; --tx3:#6f7a97;
  --acc:#7c5cff; --acc2:#22d3ee; --good:#34d399; --warn:#fbbf24;
  --r:16px; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --oak:#f59e0b; --hot:#a78bfa; --h2o:#22d3ee; --taco:#fb7185; --hoi:#34d399; --arc:#60a5fa; --giga:#f472b6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(124,92,255,.16), transparent 60%),
    radial-gradient(1000px 600px at 8% 4%, rgba(34,211,238,.12), transparent 55%),
    linear-gradient(180deg,#070b16,#080d1a 40%,#070a13);
  color:var(--tx); font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}

/* nav */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,11,22,.86),rgba(7,11,22,.5));border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,var(--acc),var(--acc2),var(--giga),var(--acc));
  box-shadow:0 6px 18px -4px rgba(124,92,255,.6);position:relative}
.brand .mk::after{content:"";position:absolute;inset:6px;border-radius:5px;background:#0a0f1e}
.brand small{display:block;font-weight:600;color:var(--tx3);font-size:11px;letter-spacing:.6px;margin-top:-2px}
.spacer{flex:1}
.navbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s}
.navbtn:hover{color:var(--tx);border-color:var(--acc);transform:translateY(-1px)}
.langtoggle{display:flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--panel)}
.langtoggle button{padding:8px 13px;background:transparent;border:0;color:var(--tx3);font-weight:700;font-size:13px;cursor:pointer;transition:.18s}
.langtoggle button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}

/* hero */
.hero{padding:66px 0 30px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);
  background:var(--panel);color:var(--tx2);font-size:12.5px;font-weight:600;letter-spacing:.4px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
h1{font-size:clamp(30px,5vw,52px);line-height:1.06;margin:20px 0 14px;font-weight:850;letter-spacing:-.5px}
h1 .grad{background:linear-gradient(100deg,#fff 10%,var(--acc2) 45%,var(--giga) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(15px,2vw,18px);color:var(--tx2);max-width:760px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:16px;margin:38px 0 8px}
.kpi{padding:20px 20px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.kpi .v{font-size:34px;font-weight:850;letter-spacing:-.5px}
.kpi .l{color:var(--tx2);font-size:13px;margin-top:3px;font-weight:600}
.kpi .s{color:var(--tx3);font-size:11.5px;margin-top:6px}

section{padding:34px 0}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.shead h2{font-size:23px;font-weight:800;margin:0;letter-spacing:-.3px}
.shead p{margin:0;color:var(--tx3);font-size:13.5px}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:750}
.card .sub{color:var(--tx3);font-size:12px;margin-bottom:14px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:170px}
.lg{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 8px;border-radius:8px;cursor:default;transition:.15s}
.lg:hover{background:var(--panel2)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg .nm{flex:1;color:var(--tx2);font-weight:600}
.lg .vl{color:var(--tx);font-weight:700}
.lg .pc{color:var(--tx3);font-size:11.5px;width:44px;text-align:right}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:112px 1fr auto;align-items:center;gap:12px}
.bar .bn{font-size:13px;font-weight:700;color:var(--tx2)}
.bar .track{height:12px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:7px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.bar .bv{font-size:12px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* feature matrix */
.matrix{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;min-width:760px}
table.mx th,table.mx td{padding:9px 6px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--line)}
table.mx th{color:var(--tx3);font-weight:700;position:sticky;top:0}
table.mx td.name{text-align:left;font-weight:750;white-space:nowrap;padding-left:4px}
table.mx td.name .cd{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.chk{display:inline-block;width:16px;height:16px;border-radius:50%;line-height:16px;font-size:11px}
.chk.y{background:rgba(52,211,153,.16);color:var(--good)}
.chk.n{color:var(--tx3);opacity:.4}

/* comparison table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.cmp{border-collapse:collapse;width:100%;min-width:1080px}
table.cmp thead th{position:sticky;top:0;background:rgba(12,18,34,.96);backdrop-filter:blur(6px);
  text-align:left;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx3);font-weight:700;padding:14px 14px;border-bottom:1px solid var(--line2);z-index:2}
table.cmp tbody td{padding:15px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
table.cmp tbody tr.row{cursor:pointer;transition:.15s}
table.cmp tbody tr.row:hover{background:var(--panel2)}
.dsname{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px}
.dsname .bar3{width:4px;height:30px;border-radius:3px;flex:none}
.dsname .cap{color:var(--tx3);font-weight:600;font-size:11.5px;margin-top:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.lic{background:rgba(124,92,255,.14);color:#c4b5fd;border:1px solid rgba(124,92,255,.25)}
.badge.ven{background:rgba(34,211,238,.12);color:#67e8f9;border:1px solid rgba(34,211,238,.22)}
.badge.view{background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid var(--line2)}
.mini{color:var(--tx3);font-size:11.5px}
.cov{margin-top:7px}
.cov .cbar{height:7px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;width:120px}
.cov .cbar i{display:block;height:100%;border-radius:5px}
.chip{display:inline-block;padding:2px 7px;margin:2px 3px 2px 0;border-radius:6px;font-size:11px;background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid var(--line)}
.exp{display:none}
.exp.open{display:table-row}
.exp td{background:rgba(9,13,25,.66);padding:0}
.expinner{padding:22px 26px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:26px}
.expinner h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc2)}
.expinner p{margin:0 0 12px;color:var(--tx2);font-size:13px;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv b{color:var(--tx3);font-weight:600}
.kv span{color:var(--tx);font-weight:700;text-align:right}
.openbtn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 14px;border-radius:9px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;border:0}
.caret{transition:.2s;color:var(--tx3);font-size:12px}
tr.row.open .caret{transform:rotate(90deg);color:var(--acc2)}

footer{padding:40px 0 60px;color:var(--tx3);font-size:12.5px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
.note{color:var(--tx3);font-size:12px;margin-top:14px}
.tip{position:fixed;pointer-events:none;z-index:99;background:rgba(10,15,28,.97);border:1px solid var(--line2);border-radius:9px;
  padding:8px 11px;font-size:12px;color:var(--tx);box-shadow:var(--shadow);opacity:0;transition:opacity .12s;max-width:220px}
@media(max-width:960px){.charts{grid-template-columns:1fr}.expinner{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}.hero{padding:40px 0 20px}}
</style>
</head>

    <div class="card" style="margin-top:18px">

      <div class="matrix"><table class="mx" id="mx"></table></div>
    </div>
  </section>

  <section>
    <div class="shead"><h2 data-i="sec_table">数据集详细对比</h2><p data-i="sec_table_sub"></p></div>
    <div class="tablewrap"><table class="cmp" id="cmp"></table></div>
    <div class="note" data-i="tbl_note"></div>
  </section>
</div>

<footer><div class="wrap"><span data-i="footer"></span></div></footer>

const tip=document.getElementById("tip");
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e);}
function moveTip(e){const p=12;let x=e.clientX+p,y=e.clientY+p;if(x+230>innerWidth)x=e.clientX-230;tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.opacity=0;}

const NOANIM = new URLSearchParams(location.search).get("static")==="1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderKPIs(){
  const items=KPI();
  document.getElementById("kpis").innerHTML = items.map((k,i)=>
    `<div class="kpi"><div class="v tnum" id="kpi${i}">${k.F(k.v)}</div><div class="l">${gv(k.l)}</div><div class="s">${gv(k.s)}</div></div>`).join("");
  if(NOANIM) return;
  items.forEach((k,i)=>{ const el=document.getElementById("kpi"+i), target=k.v; el.textContent="0"; let t0=null, dur=1100;
    const step=(ts)=>{ if(!t0)t0=ts; const p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=k.F(target*e); if(p<1)requestAnimationFrame(step); else el.textContent=k.F(target); };
    requestAnimationFrame(step);
  });
}

function renderDonut(){
  const total=sum(d=>d.local), R=78, r=48, cx=90, cy=90; let a0=-Math.PI/2;
  const arcs=DS.map(d=>{ const frac=d.local/total, a1=a0+frac*2*Math.PI;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
    const large=frac>0.5?1:0; a0=a1;
    return `<path d="M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z"
      fill="${d.hex}" opacity=".9" data-k="${d.key}" style="cursor:default;transition:.15s"/>`; }).join("");
  document.getElementById("donut").innerHTML =
    `<svg width="180" height="180" viewBox="0 0 180 180">${arcs}
     <text x="90" y="86" text-anchor="middle" fill="var(--tx)" font-size="26" font-weight="800">${fmt(total)}</text>
     <text x="90" y="104" text-anchor="middle" fill="var(--tx3)" font-size="11">${gv({zh:"本地序列",en:"local seqs"})}</text></svg>`;
  document.getElementById("donutleg").innerHTML = DS.map(d=>{
    const pc=(100*d.local/total).toFixed(d.local/total<0.1?1:0);
    return `<div class="lg" data-k="${d.key}"><span class="sw" style="background:${d.hex}"></span>
      <span class="nm">${d.key}</span><span class="vl tnum">${d.local}</span><span class="pc tnum">${pc}%</span></div>`; }).join("");
  const hl=(k,on)=>{ document.querySelectorAll(`#donut path`).forEach(p=>p.style.opacity=(!k||p.dataset.k===k)?".95":".25");
    if(!on)document.querySelectorAll(`#donut path`).forEach(p=>p.style.opacity=".9"); };
  document.querySelectorAll("#donutleg .lg").forEach(l=>{ l.onmouseenter=()=>hl(l.dataset.k,1); l.onmouseleave=()=>hl(null,0); });
  document.querySelectorAll("#donut path").forEach(p=>{
    p.onmouseenter=e=>{hl(p.dataset.k,1);const d=DS.find(x=>x.key===p.dataset.k);showTip(e,`<b>${d.key}</b><br>${d.local} ${gv({zh:'本地序列',en:'local seqs'})} · ${d.overlay} ${gv({zh:'已可视化',en:'visualized'})}`);};
    p.onmousemove=moveTip; p.onmouseleave=()=>{hl(null,0);hideTip();}; });
}

function renderFrameBars(){
  const maxL=Math.log10(Math.max(...DS.map(d=>d.frames))), minL=Math.log10(Math.min(...DS.map(d=>d.frames)));
  document.getElementById("framebars").innerHTML = DS.slice().sort((a,b)=>b.frames-a.frames).map((d,i)=>{
    const w=8+92*(Math.log10(d.frames)-minL)/(maxL-minL);
    return `<div class="bar"><div class="bn">${d.key}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:linear-gradient(90deg,${d.hex}bb,${d.hex});animation-delay:${i*70}ms"></div></div>
      <div class="bv">${fmt(d.frames)}</div></div>`; }).join("");
}

function renderHourBars(){
  const maxH=Math.max(...DS.map(d=>d.hours));
  document.getElementById("hourbars").innerHTML = DS.slice().sort((a,b)=>b.hours-a.hours).map((d,i)=>{
    const w=6+94*(d.hours/maxH), star=d.hsrc==="paper"?'<span style="color:var(--tx3)"> *</span>':'';
    return `<div class="bar"><div class="bn">${d.key}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:linear-gradient(90deg,${d.hex}bb,${d.hex});animation-delay:${i*70}ms"></div></div>
      <div class="bv">${d.hours} h${star}</div></div>`; }).join("");
}

function applyStatic(){
  const t=I18N[LANG];
  document.querySelectorAll("[data-i]").forEach(el=>{ const k=el.getAttribute("data-i"); if(t[k]!=null)el.textContent=t[k]; });
  document.querySelector('[data-i="h1"]').innerHTML = `${t.h1_a} <span class="grad">${t.h1_b}</span>`;
  document.documentElement.lang = LANG==="zh"?"zh":"en";
  document.getElementById("zh").classList.toggle("on",LANG==="zh");
  document.getElementById("en").classList.toggle("on",LANG==="en");
  document.getElementById("browseNav").href = browseUrl();
}

function renderAll(){ applyStatic(); renderKPIs(); renderDonut(); renderFrameBars(); renderHourBars(); renderMatrix(); renderTable(); }
function setLang(l){ LANG=l; localStorage.setItem("hw_lang",l); renderAll(); }
renderAll();
</script>
</body>
